<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewBodor 企业管理后台</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- 登录视图 -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <h1>NewBodor <span>企业管理后台</span></h1>
    <p class="sub">云之家 · 管理中心 复刻版（自研）</p>
    <label>企业管理员邮箱</label>
    <input id="login-email" type="email" value="admin@newbodor.local" autocomplete="username">
    <label>密码</label>
    <input id="login-password" type="password" value="admin123" autocomplete="current-password">
    <button id="login-btn">登录</button>
    <p class="login-hint">默认账号：admin@newbodor.local / admin123</p>
    <p id="login-error" class="login-error"></p>
  </div>
</div>

<!-- 后台主界面 -->
<div id="app" class="layout" style="display:none">
  <aside class="sidebar">
    <div class="brand"><div class="logo">N</div> NewBodor <span class="tag">管理后台</span></div>
    <div class="grp">管理中心</div>
    <nav class="nav" id="nav">
      <a data-page="overview" class="active"><span class="ic">🏠</span>团队概况</a>
      <a data-page="contacts"><span class="ic">👥</span>通讯录</a>
      <a data-page="apps"><span class="ic">🧩</span>应用管理</a>
      <a data-page="billing"><span class="ic">💰</span>计费服务</a>
      <a data-page="circle"><span class="ic">💬</span>同事圈</a>
      <a data-page="security"><span class="ic">🛡️</span>信息安全平台</a>
      <a data-page="settings"><span class="ic">⚙️</span>系统设置</a>
      <a data-page="open"><span class="ic">🔗</span>开放平台</a>
      <a data-page="logs"><span class="ic">📜</span>系统日志</a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2 id="page-title">团队概况</h2>
      <div class="user">
        <span id="top-enterprise">NewBodor 演示企业</span> ｜ <span id="top-user">管理员</span>
        <button id="logout-btn" class="link-btn">退出</button>
      </div>
    </div>
    <div id="content" class="content"></div>
  </div>
</div>

<!-- 通用模态框 -->
<div id="modal" class="modal-mask" style="display:none">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title">编辑</h3><button class="x" id="modal-close">×</button></div>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-foot"><button id="modal-cancel" class="btn">取消</button><button id="modal-ok" class="btn primary">保存</button></div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script src="/js/app.js"></script>
</body>
</html>
